name: github-pages

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build:pages
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_REVIEW_API_URL: https://juelens-308371-7-1304965105.sh.run.tcloudbase.com/api/review
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
